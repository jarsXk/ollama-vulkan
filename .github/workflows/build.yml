name: Build Ollama Vulkan for Windows

on:
  workflow_dispatch:
    inputs:
      ollama_ref:
        description: "Ollama branch, tag or commit"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout build repository 
        uses: actions/checkout@v4 
        with: 
          path: build-repo


      - name: Checkout upstream Ollama
        uses: actions/checkout@v4
        with:
          repository: ollama/ollama
          ref: ${{ inputs.ollama_ref }}
          path: ollama
          fetch-depth: 0

      - name: Get Ollama version
        id: ollama-version
        shell: pwsh
        run: |
          $version = git -C ollama describe --tags --abbrev=0 2>$null
          if (!$version) {
            $version = git -C ollama rev-parse --short HEAD
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Ollama version: $version"    

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ollama/go.mod
          cache: false

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installation failed"
          }
          $sdk = Get-ChildItem C:\VulkanSDK -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (!$sdk) {
            throw "Vulkan SDK directory not found"
          }
          "VULKAN_SDK=$($sdk.FullName)" |
            Out-File $env:GITHUB_ENV -Append
          "$($sdk.FullName)\Bin" |
            Out-File $env:GITHUB_PATH -Append

      - name: Configure Vulkan backend
        working-directory: ollama
        shell: pwsh
        run: |
          cmake -B build . `
            -DOLLAMA_LLAMA_BACKENDS=vulkan
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

      - name: Build Ollama
        working-directory: ollama
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) {
            throw "Ollama build failed"
          }

      - name: Prepare package
        working-directory: ollama
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path ".\ollama.exe")) {
            throw "ollama.exe was not produced by the build"
          }
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item ".\ollama.exe" "$dist\ollama.exe"
          # Install the native runtime payload into the package.
          cmake --install build --prefix "$dist"
          if ($LASTEXITCODE -ne 0) {
            throw "CMake installation failed"
          }
          if (!(Test-Path "$dist\ollama.exe")) {
            throw "ollama.exe missing from package"
          }
          Write-Host "Package contents:"
          Get-ChildItem $dist -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize
          Write-Host "Package contents:"
          Get-ChildItem $dist -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Add startup script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = Join-Path $env:GITHUB_WORKSPACE "build-repo\start-ollama.cmd"
          if (!(Test-Path $script)) {
            throw "Startup script not found: $script"
          }
          Copy-Item $script (Join-Path $env:GITHUB_WORKSPACE "dist\start-ollama.cmd")

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.ollama-version.outputs.version }}"
          $archive = "packages\ollama-vulkan-$version-windows-amd64.zip"
          New-Item -ItemType Directory -Force packages | Out-Null
          Compress-Archive `
            -Path "dist\*" `
            -DestinationPath $archive `
            -CompressionLevel Optimal `
            -Force
          if (!(Test-Path $archive)) {
            throw "ZIP archive was not created"
          }
          Write-Host "Created archive: $archive"

      - name: Upload ZIP archive
        uses: actions/upload-artifact@v4
        with:
          name: ollama-vulkan-${{ steps.ollama-version.outputs.version }}-windows-amd64-portable
          path: packages/*.zip
          if-no-files-found: error
          retention-days: 14          

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed"
          }

      - name: Build EXE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.ollama-version.outputs.version }}"
          $script = Join-Path $env:GITHUB_WORKSPACE "build-repo\installer\ollama-vulkan.iss"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $script)) {
            throw "Installer script not found: $script"
          }
          if (!(Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found"
          }
          Write-Host "Checking dist directory:"
          Get-ChildItem "$env:GITHUB_WORKSPACE\dist" -Recurse |
            Select-Object FullName
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\packages" | Out-Null
          & $iscc "/DMyAppVersion=$version" $script
          if ($LASTEXITCODE -ne 0) {
            throw "EXE installer build failed with exit code $LASTEXITCODE"
          }

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: ollama-vulkan-${{ steps.ollama-version.outputs.version }}-windows-amd64
          path: packages/*.exe
          if-no-files-found: error
          retention-days: 14 
      
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ollama-vulkan-${{ steps.ollama-version.outputs.version }}
          name: ${{ steps.ollama-version.outputs.version }}
          body: |
            Windows x64 build of Ollama with Vulkan backend.

            Based on upstream Ollama ${{ steps.ollama-version.outputs.version }}.

            ## Downloads

            - **EXE installer** — installs Ollama Vulkan.
            - **ZIP archive** — portable files for manual extraction.
          files: |
            packages/*.exe
            packages/*.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
